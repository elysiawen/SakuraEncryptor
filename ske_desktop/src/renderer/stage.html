<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same tight CSP as the shell: this page only ever shows local media.
         `connect-src` covers the ranged fetch for a music window's cover art. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; media-src 'self' http://127.0.0.1:*; img-src 'self' data: blob: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'"
    />
    <title>播放器</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./stage-main.js"></script>
  </body>
</html>
