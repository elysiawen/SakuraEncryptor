name: Build and Release

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'ske_cli/**'
      - 'ske_web/**'
      - 'ske_android/**'
      - 'ske_extension/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # artifact_name is passed to PyInstaller as --name (no platform
        # extension); asset_name is the resulting file inside dist/, which is
        # what gets uploaded and becomes the Release asset name. Keeping the two
        # in sync means the Actions artifact list matches what users download.
        include:
          - runner: windows-latest
            platform: windows
            arch: x86_64
            artifact_name: SakuraEncryptor-Windows-x64
            asset_name: SakuraEncryptor-Windows-x64.exe
          - runner: ubuntu-latest
            platform: linux
            arch: x86_64
            artifact_name: SakuraEncryptor-Linux-x64
            asset_name: SakuraEncryptor-Linux-x64
          - runner: macos-latest
            platform: macos
            arch: arm64
            artifact_name: SakuraEncryptor-MacOS-ARM64
            asset_name: SakuraEncryptor-MacOS-ARM64
          # macos-13 was retired on 2025-12-04; its jobs queue forever with no
          # runner. macos-15-intel is the official x86_64 replacement — note
          # that the unsuffixed "macos-15" is arm64, not Intel.
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            artifact_name: SakuraEncryptor-MacOS-x64
            asset_name: SakuraEncryptor-MacOS-x64
          - runner: ubuntu-latest
            platform: linux
            arch: arm64
            artifact_name: SakuraEncryptor-Linux-ARM64
            asset_name: SakuraEncryptor-Linux-ARM64
            use_qemu: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        if: "!matrix.use_qemu"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up QEMU
        if: matrix.use_qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build (native)
        if: "!matrix.use_qemu"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # The [video] extra pulls in PyAV. It is optional for the source
          # install, but the released binary must decrypt video previews, so
          # it has to be present *at build time*: PyInstaller only bundles what
          # is importable, and crypto.py imports av lazily inside a function.
          # pyinstaller-hooks-contrib ships hook-av (collects every FFmpeg DLL
          # from av.libs) and hook-tkinterdnd2 (collects the platform tkdnd
          # sub-directory), so no custom hook is needed.
          pip install ".[video]"

          # Every container carries an encrypted JPEG preview; video previews
          # come from PyAV. Prove both paths work here, because PyInstaller only
          # bundles what is importable at build time and crypto.py imports PyAV
          # lazily — a build machine without it yields a working exe that
          # silently drops every video preview.
          python scripts/verify_thumbnails.py

          ICON_ARG=""
          if [ "${{ matrix.platform }}" == "windows" ] && [ -f "ske_cli/icon.ico" ]; then
            ICON_ARG="--icon=ske_cli/icon.ico"
          fi

          DATA_SEP=":"
          if [ "${{ matrix.platform }}" == "windows" ]; then DATA_SEP=";"; fi

          ADD_DATA=""
          if [ -f "ske_cli/icon.ico" ]; then
            ADD_DATA="--add-data ske_cli/icon.ico${DATA_SEP}."
          fi

          pyinstaller --onefile --windowed --name "${{ matrix.artifact_name }}" $ICON_ARG $ADD_DATA ske_cli/gui.py

          # A bundle that silently lost tkdnd or FFmpeg still builds fine and
          # only breaks on the user's machine, where nothing points back at the
          # packaging step.
          python scripts/verify_bundle.py "build/${{ matrix.artifact_name }}"

      - name: Build (Linux ARM64 via QEMU)
        if: matrix.use_qemu
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            # Debian/Ubuntu ship tkinter as a separate package. Without it the
            # PyInstaller hook for tkinterdnd2 fails with
            # "ModuleNotFoundError: No module named 'tkinter'".
            apt-get install -y python3 python3-pip python3-venv python3-tk tk
          dockerPostBuildCommands: |
            chown -R $(id -u):$(id -g) dist/
          run: |
            python3 -m venv /tmp/venv
            source /tmp/venv/bin/activate
            pip install --upgrade pip
            pip install pyinstaller
            # Same reasoning as the native build: PyAV must be installed or the
            # video-preview code path is silently stripped from the binary.
            pip install ".[video]"

            python scripts/verify_thumbnails.py

            ADD_DATA=""
            if [ -f "ske_cli/icon.ico" ]; then
              ADD_DATA="--add-data ske_cli/icon.ico:."
            fi

            pyinstaller --onefile --windowed --name "${{ matrix.artifact_name }}" $ADD_DATA ske_cli/gui.py

            # See the native build: this catches a bundle that lost tkdnd or
            # FFmpeg while still producing an exe.
            python scripts/verify_bundle.py "build/${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  build-web:
    name: Build Web Player
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ske_web/package-lock.json

      - name: Install dependencies
        run: |
          cd ske_web
          npm ci

      - name: Build
        run: |
          cd ske_web
          npm run build

      - name: Package web dist
        run: |
          cd ske_web/dist
          zip -r ../../SakuraEncryptor-Web.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraEncryptor-Web
          path: SakuraEncryptor-Web.zip

  # The extension has no build step — it is plain JS + HTML loaded unpacked.
  # Packaging is therefore "validate then zip", and the zip must keep
  # manifest.json at its root: Chrome reads it from the extracted folder's top
  # level, exactly like loading `ske_extension/` itself.
  #
  # No .crx on purpose: a packed CRX is signed with the private key matching the
  # manifest `key`, and that file is not in the repository. Signing with any
  # other key changes the extension ID, which would break the `externally_
  # connectable` bridge the web app addresses (EXTENSION_ID in
  # ske_web/src/composables/useExtensionBridge.js).
  build-extension:
    name: Build Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A renamed icon or a typo in manifest.json still zips fine and only
      # fails in the user's browser, where nothing points back here.
      - name: Validate manifest
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const root = 'ske_extension';
          const m = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          const refs = [
            ...Object.values(m.icons || {}),
            ...Object.values(m.action?.default_icon || {}),
            m.action?.default_popup,
            m.background?.service_worker,
          ].filter(Boolean);
          const missing = refs.filter((p) => !fs.existsSync(path.join(root, p)));
          if (missing.length) {
            console.error('manifest 引用了不存在的文件: ' + missing.join(', '));
            process.exit(1);
          }
          if (m.manifest_version !== 3) {
            console.error('expected manifest_version 3, got ' + m.manifest_version);
            process.exit(1);
          }
          console.log('manifest ok: ' + m.name + ' v' + m.version + ', ' + refs.length + ' referenced files present');
          "

      - name: Package extension
        working-directory: ske_extension
        run: |
          # Zipping the directory contents (`.`) rather than the directory
          # itself is what keeps manifest.json at the archive root — Chrome
          # refuses a folder that only contains another folder. `-x` drops OS
          # junk so a Mac checkout cannot ship .DS_Store into the archive.
          zip -r ../SakuraEncryptor-Extension.zip . \
            -x '*.DS_Store' -x '__MACOSX/*' -x '.git*'
          cd ..
          unzip -l SakuraEncryptor-Extension.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraEncryptor-Extension
          path: SakuraEncryptor-Extension.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Downloads cmdline-tools and puts them on $PATH, but deliberately does
      # NOT accept licences itself: on cmdline-tools 16.0 the action's internal
      # `sdkmanager --licenses` call raises the interactive "Accept? (y/N)"
      # prompt, and a runner with no TTY can only answer it with EOF — which
      # sdkmanager reads as "no" and then exits non-zero. That killed the step
      # before our own licence step below ever got a chance to run.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''

      - name: Accept licences and install SDK packages
        run: |
          # `yes` keeps stdin fed, so sdkmanager never blocks on a prompt.
          # No `|| true` here: swallowing a licence failure would only push the
          # error into Gradle, where the message is far harder to read.
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The signing key never lives in the repository. It arrives base64-encoded
      # from a repository secret and exists only on this throwaway runner.
      - name: Configure release signing
        working-directory: ske_android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. The APK would come out unsigned and impossible to install, so failing here instead."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          # printf rather than a heredoc: YAML block scalars keep their leading
          # indentation, which would otherwise be written into the file.
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Run unit tests
        working-directory: ske_android
        run: |
          # The wrapper is committed from Windows and has no execute bit.
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        working-directory: ske_android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p android-dist
          cp ske_android/app/build/outputs/apk/release/app-release.apk \
             android-dist/SakuraEncryptor-Android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraEncryptor-Android
          path: android-dist/SakuraEncryptor-Android.apk

      # The runner is discarded anyway, but the key should not linger in the
      # workspace longer than the build needs it.
      - name: Remove signing material
        if: always()
        working-directory: ske_android
        run: rm -rf keystore keystore.properties

  release:
    name: Create GitHub Release
    needs: [build, build-web, build-android, build-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Generate Version Tag and Build Time
        id: meta
        run: |
          # Version: YYYYMMDD (e.g. 20261028), no build counter.
          # A second run on the same day updates that day's release instead of
          # creating a new one; the commit sha stays visible in the body.
          DATE=$(date +'%Y%m%d')
          TAG=$DATE
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # Build Time: YYYY-MM-DD HH:MM:SS
          TIME=$(date +'%Y-%m-%d %H:%M:%S')
          echo "time=$TIME" >> $GITHUB_OUTPUT
          
          echo "Release Tag: $TAG"
          echo "Build Time: $TIME"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          files: binaries/*
          generate_release_notes: true
          body: |
            ## Sakura Encryptor 自动构建
            - **版本号**: ${{ steps.meta.outputs.tag }}
            - **构建时间**: ${{ steps.meta.outputs.time }}
            - **Commit**: ${{ github.sha }}

            ### 下载什么
            - `SakuraEncryptor-Android.apk` — 安卓客户端，已签名，可直接安装
            - `SakuraEncryptor-Windows-x64.exe` — Windows 桌面端
            - `SakuraEncryptor-Linux-x64` / `SakuraEncryptor-Linux-ARM64` — Linux 桌面端
            - `SakuraEncryptor-MacOS-ARM64` / `SakuraEncryptor-MacOS-x64` — macOS 桌面端
            - `SakuraEncryptor-Web.zip` — 网页播放器，解压后自行托管
            - `SakuraEncryptor-Extension.zip` — Chrome 跨域助手，解压后在 `chrome://extensions` 开发者模式下「加载已解压的扩展程序」
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
