name: Build and Release

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'ske_cli/**'
      - 'ske_web/**'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # artifact_name is passed to PyInstaller as --name (no platform
        # extension); asset_name is the resulting file inside dist/, which is
        # what gets uploaded and becomes the Release asset name. Keeping the two
        # in sync means the Actions artifact list matches what users download.
        include:
          - runner: windows-latest
            platform: windows
            arch: x86_64
            artifact_name: SakuraEncryptor-Windows-x64
            asset_name: SakuraEncryptor-Windows-x64.exe
          - runner: ubuntu-latest
            platform: linux
            arch: x86_64
            artifact_name: SakuraEncryptor-Linux-x64
            asset_name: SakuraEncryptor-Linux-x64
          - runner: macos-latest
            platform: macos
            arch: arm64
            artifact_name: SakuraEncryptor-MacOS-ARM64
            asset_name: SakuraEncryptor-MacOS-ARM64
          # macos-13 was retired on 2025-12-04; its jobs queue forever with no
          # runner. macos-15-intel is the official x86_64 replacement — note
          # that the unsuffixed "macos-15" is arm64, not Intel.
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            artifact_name: SakuraEncryptor-MacOS-x64
            asset_name: SakuraEncryptor-MacOS-x64
          - runner: ubuntu-latest
            platform: linux
            arch: arm64
            artifact_name: SakuraEncryptor-Linux-ARM64
            asset_name: SakuraEncryptor-Linux-ARM64
            use_qemu: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        if: "!matrix.use_qemu"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up QEMU
        if: matrix.use_qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build (native)
        if: "!matrix.use_qemu"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

          ICON_ARG=""
          if [ "${{ matrix.platform }}" == "windows" ] && [ -f "ske_cli/icon.ico" ]; then
            ICON_ARG="--icon=ske_cli/icon.ico"
          fi

          DATA_SEP=":"
          if [ "${{ matrix.platform }}" == "windows" ]; then DATA_SEP=";"; fi

          ADD_DATA=""
          if [ -f "ske_cli/icon.ico" ]; then
            ADD_DATA="--add-data ske_cli/icon.ico${DATA_SEP}."
          fi

          pyinstaller --onefile --windowed --name "${{ matrix.artifact_name }}" $ICON_ARG $ADD_DATA ske_cli/gui.py

      - name: Build (Linux ARM64 via QEMU)
        if: matrix.use_qemu
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            # Debian/Ubuntu ship tkinter as a separate package. Without it the
            # PyInstaller hook for tkinterdnd2 fails with
            # "ModuleNotFoundError: No module named 'tkinter'".
            apt-get install -y python3 python3-pip python3-venv python3-tk tk
          dockerPostBuildCommands: |
            chown -R $(id -u):$(id -g) dist/
          run: |
            python3 -m venv /tmp/venv
            source /tmp/venv/bin/activate
            pip install --upgrade pip
            pip install pyinstaller
            pip install .

            ADD_DATA=""
            if [ -f "ske_cli/icon.ico" ]; then
              ADD_DATA="--add-data ske_cli/icon.ico:."
            fi

            pyinstaller --onefile --windowed --name "${{ matrix.artifact_name }}" $ADD_DATA ske_cli/gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  build-web:
    name: Build Web Player
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ske_web/package-lock.json

      - name: Install dependencies
        run: |
          cd ske_web
          npm ci

      - name: Build
        run: |
          cd ske_web
          npm run build

      - name: Package web dist
        run: |
          cd ske_web/dist
          zip -r ../../SakuraEncryptor-Web.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuraEncryptor-Web
          path: SakuraEncryptor-Web.zip

  release:
    name: Create GitHub Release
    needs: [build, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Generate Version Tag and Build Time
        id: meta
        run: |
          # Version: YYYYMMDD + 3-digit run number (e.g., 20260308001)
          DATE=$(date +'%Y%m%d')
          TAG=$(printf "%s%03d" "$DATE" "${{ github.run_number }}")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # Build Time: YYYY-MM-DD HH:MM:SS
          TIME=$(date +'%Y-%m-%d %H:%M:%S')
          echo "time=$TIME" >> $GITHUB_OUTPUT
          
          echo "Release Tag: $TAG"
          echo "Build Time: $TIME"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          files: binaries/*
          generate_release_notes: true
          body: |
            ## Sakura Encryptor 自动构建
            - **版本号**: ${{ steps.meta.outputs.tag }}
            - **构建时间**: ${{ steps.meta.outputs.time }}
            - **Commit**: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
