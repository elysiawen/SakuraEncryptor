name: Build and Release

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'ske_cli/**'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: ske-gui-windows.exe
            asset_name: SakuraEncryptor-Windows.exe
          - os: ubuntu-latest
            artifact_name: ske-gui-linux
            asset_name: SakuraEncryptor-Linux
          - os: macos-latest
            artifact_name: ske-gui-macos
            asset_name: SakuraEncryptor-MacOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Detect icon based on OS (only windows uses .ico usually)
          ICON_ARG=""
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            if [ -f "ske_cli/icon.ico" ]; then
              ICON_ARG="--icon=ske_cli/icon.ico"
            fi
          fi
          
          DATA_SEP=":"
          if [ "${{ matrix.os }}" == "windows-latest" ]; then DATA_SEP=";"; fi
          
          ADD_DATA=""
          if [ -f "ske_cli/icon.ico" ]; then
            ADD_DATA="--add-data ske_cli/icon.ico${DATA_SEP}."
          fi

          pyinstaller --onefile --windowed --name "${{ matrix.artifact_name }}" $ICON_ARG $ADD_DATA ske_cli/gui.py

      - name: Rename and Prepare Asset
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Generate Version Tag
        id: tag
        run: |
          # Format: YYYYMMDD + 3-digit run number (e.g., 20260308001)
          DATE=$(date +'%Y%m%d')
          TAG=$(printf "%s%03d" "$DATE" "${{ github.run_number }}")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release Tag: $TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: binaries/*
          generate_release_notes: true
          body: |
            ## Sakura Encryptor 自动构建
            - **版本号**: ${{ steps.tag.outputs.tag }}
            - **构建时间**: $(date +'%Y-%m-%d %H:%M:%S')
            - **Commit**: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
