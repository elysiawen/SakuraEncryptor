<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Sakura Encryptor 跨域小助手</title>
  <style>
    :root {
      --bg: #0d0d18;
      --card: #17172a;
      --line: rgba(255, 255, 255, 0.1);
      --text: #e8e8f0;
      --muted: #9090b0;
      --accent: #8b5cf6;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      width: 330px;
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
    }

    .sub {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .hint {
      margin: 0 0 12px;
      padding: 8px 10px;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.08);
      color: #f0d9b0;
      font-size: 12px;
    }

    .origin {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      word-break: break-all;
    }

    .hint.pending {
      border-color: rgba(139, 92, 246, 0.45);
      background: rgba(139, 92, 246, 0.1);
      color: #d9cdfb;
      word-break: break-all;
    }

    .origin span { color: var(--text); }

    form {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    /* Scoped on purpose: a bare `input` rule also hits the two checkboxes,
       stretches them with `flex: 1` and hides their labels behind it. */
    #domain {
      flex: 1;
      min-width: 0;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 12px;
    }

    #domain:focus {
      outline: none;
      border-color: var(--accent);
    }

    input[type="checkbox"] {
      flex: none;
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--accent);
    }

    button {
      padding: 7px 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    ul {
      margin: 0 0 10px;
      padding: 0;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      background: var(--card);
      font-size: 12px;
      word-break: break-all;
    }

    li + li { border-top: 1px solid var(--line); }

    .empty {
      padding: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .badge {
      flex: none;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      white-space: nowrap;
    }

    .badge.ok { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .badge.bad { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .badge.unknown { background: rgba(255, 255, 255, 0.06); color: var(--muted); }

    .remove {
      flex: none;
      padding: 2px 8px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }

    .remove:hover {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .auto {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      color: var(--text);
    }

    .auto-note {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
    }

    .status.on { color: #22c55e; }
    .status.off { color: var(--warn); }
    .status.error { color: var(--danger); }
  </style>
</head>
<body>
  <h1>Sakura Encryptor 跨域小助手</h1>
  <p class="sub">给指定网盘的跨域响应补 <code>Access-Control-Allow-Origin</code>，网页端才读得到密文。</p>

  <p class="origin">页面来源：<span id="origin">—</span></p>

  <p id="pending" class="hint pending" hidden></p>

  <form id="add-form">
    <input id="domain" placeholder="请输入网址，例如 pan.example.com" autocomplete="off" spellcheck="false" />
    <button id="add" type="submit">添加</button>
  </form>

  <ul id="list"></ul>

  <label class="auto">
    <input id="auto" type="checkbox" />
    <span>自动添加检测到的网盘</span>
  </label>
  <p class="auto-note">开启后本插件会获得「所有网站」的读取权限，但只有列表里的域名才会被改写。</p>

  <footer>
    <label>
      <input id="enabled" type="checkbox" />
      启用
    </label>
    <span id="status" class="status">—</span>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
